name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir el zip
        run: unzip -q dinosurvival.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar
        working-directory: dinosurvival
        run: gradle build

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: dinosurvival-mod
          path: dinosurvival/build/libs/*.jar
